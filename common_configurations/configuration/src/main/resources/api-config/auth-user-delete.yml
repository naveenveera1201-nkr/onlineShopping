apis:
  - id: auth-user-delete
    name: Logout / Revoke Token
    version: v1
    method: GET
    path: /api/v1/auth/deleteuser
    description: delete the user account in the application.
    enabled: true
    security:
      authentication:
        enabled: false
        type: JWT
        roles:
        - CUSTOMER
      authorization:
        enabled: true
      rateLimit:
        enabled: true
        requestsPerMinute: 60
        requestsPerHour: 1000
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters:
      - name: reason
        type: String
        location: BODY
        required: true
        sensitive: true
        validation:
          minLength: 1
          errorMessage: reason is required
      - name: remarks
        type: String
        location: BODY
        required: false
        validation:
          minLength: 1
          errorMessage: reason is required
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: data
        type: String
        description: response details
      - name: createdAt
        type: LocalDateTime
        description: Creation timestamp
      - name: createdBy
        type: String
        description: created by
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.auth.deleteuser
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: INSERT
        entity: Session
        mapping:
          refreshToken: "#{encrypted(request.refreshToken)}"
          createdAt: "#{now()}"
          status: ACTIVE
    callbacks:
    - event: SUCCESS
      type: WEBHOOK
      url: "https://api.nammakadaitheru.in/webhooks/session-event"
