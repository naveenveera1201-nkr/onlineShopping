apis:
  - id: wishlist-get
    name: Get Wishlist Items
    version: v1
    method: POST
    path: /api/v1/customer/wishlist
    description: Returns all items the customer has saved (heart-marked), with current price and availability status.
    enabled: true
    security:
      authentication:
        enabled: true
        type: JWT
        roles:
        - customer
      authorization:
        enabled: true
      rateLimit:
        enabled: true
        requestsPerMinute: 60
        requestsPerHour: 1000
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters:
      - name: latitude
        type: Double
        location: BODY
        required: true
        validation:
          min: -90.0
          max: 90.0
          errorMessage: Latitude must be between -90 and 90
      - name: longitude
        type: Double
        location: BODY
        required: true
        validation:
          min: -180.0
          max: 180.0
          errorMessage: Longitude must be between -180 and 180
      - name: radius
        type: Double
        location: BODY
        required: false
        defaultValue: '5'
        validation:
          min: 0.1
          max: 50.0
          errorMessage: Radius must be between 0.1 and 50 km
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: id
        type: Long
        description: WishlistItem identifier
      - name: history
        type: String
        description: history
      - name: data
        type: String
        description: response data
      - name: currentStatus
        type: String
        description: Current record status
        defaultValue: ACTIVE
      - name: fetchedAt
        type: LocalDateTime
        description: Data retrieval timestamp
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.wishlist.get
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: SELECT
        entity: WishlistItem
    