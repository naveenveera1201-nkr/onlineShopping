apis:
  - id: wishlist-add
    name: Add Item to Wishlist
    version: v1
    method: POST
    path: /api/v1/customer/wishlist/toggle
    description: Adds an item to the customer's wishlist. Idempotent — no error if item already saved.
    enabled: true
    security:
      authentication:
        enabled: true
        type: JWT
        roles:
        - customer
      authorization:
        enabled: true
      rateLimit:
        enabled: true
        requestsPerMinute: 60
        requestsPerHour: 1000
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters:
      - name: stockId
        type: String
        location: BODY
        required: true
        validation:
          minLength: 1
          errorMessage: Item ID is required
      - name: storeId
        type: String
        location: BODY
        required: true
        validation:
          minLength: 1
          errorMessage: storeId ID is required
      - name: stockCount
        type: String
        location: BODY
        required: true
        validation:
          minLength: 1
          errorMessage: stockCount ID is required
      - name: latitude
        type: Double
        location: BODY
        required: true
        validation:
          min: -90.0
          max: 90.0
          errorMessage: Latitude must be between -90 and 90
      - name: longitude
        type: Double
        location: BODY
        required: true
        validation:
          min: -180.0
          max: 180.0
          errorMessage: Longitude must be between -180 and 180
      - name: radiusKm
        type: Double
        location: BODY
        required: false
        defaultValue: '5'
        validation:
          min: 0.1
          max: 50.0
          errorMessage: Radius must be between 0.1 and 50 km
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: id
        type: Long
        description: Generated WishlistItem ID
      - name: history
        type: String
        description: history
      - name: data
        type: String
        description: registered data
      - name: currentStatus
        type: String
        description: Record status
        defaultValue: ACTIVE
      - name: createdAt
        type: LocalDateTime
        description: Creation timestamp
      - name: createdBy
        type: String
        description: created by
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.wishlist.toggle
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: INSERT
        entity: WishlistItem
        mapping:
          createdAt: "#{now()}"
          status: ACTIVE
    callbacks:
    - event: SUCCESS
      type: WEBHOOK
      url: "https://api.nammakadaitheru.in/webhooks/wishlistitem-event"
