apis:
  - id: types-of-stores
    name: Types of Stores
    version: v1
    method: GET
    path: /api/v1/discover/tyesofstore
    description: Returns a curated list of nearby stores across all categories, based on the customer's current GPS location.
    enabled: true
    security:
      authentication:
        enabled: true
        type: JWT
        roles:
        - customer
      authorization:
        enabled: true
      rateLimit:
        enabled: true
        requestsPerMinute: 60
        requestsPerHour: 1000
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters: []
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: id
        type: Long
        description: Store identifier
      - name: history
        type: String
        description: history
      - name: data
        type: String
        description: response data
      - name: currentStatus
        type: String
        description: Current record status
        defaultValue: ACTIVE
      - name: fetchedAt
        type: LocalDateTime
        description: Data retrieval timestamp
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.discover.typesofstore
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: SELECT
        entity: Store
        mapping:
          latitude: "#{request.latitude}"
          longitude: "#{request.longitude}"
          radiusKm: "#{request.radiusKm}"
