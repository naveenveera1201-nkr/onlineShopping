apis:
  - id: stores-update-subcategories
    name: Add category central maintenance
    version: v1
    method: POST
    path: /api/v1/central/subcategory/update
    description: Add the product sub category in the central master maintenance
    enabled: true

    security:
      authentication:
        enabled: true
        type: JWT
        roles:
          - business
      authorization:
        enabled: true
      rateLimit:
        enabled: true
        requestsPerMinute: 30
        requestsPerHour: 500
      encryption:
        enabled: true
        algorithm: AES256

    request:
      contentType: application/json

      parameters:
        - name: categoryId
          type: String
          location: BODY
          required: true
          validation:
            minLength: 1
            errorMessage: name is required
        - name: id
          type: String
          location: BODY
          required: true
          validation:
            minLength: 1
            errorMessage: name is required
        - name: name
          type: Object
          location: BODY
          required: true
          validation:
            minLength: 1
            errorMessage: name is required
          fields:
            - name: en
              type: String
              required: true
              validation:
                minLength: 1
                errorMessage: English name is required

            - name: ta
              type: String
              required: true
              validation:
                minLength: 1
                errorMessage: Tamil name is required
    response:
      successCode: 200
      contentType: application/json

      fields:
        - name: id
          type: Long
          description: Product identifier

        - name: history
          type: String
          description: History

        - name: data
          type: Object
          description: Response data

        - name: currentStatus
          type: String
          description: Current record status
          defaultValue: ACTIVE

        - name: fetchedAt
          type: LocalDateTime
          description: Data retrieval timestamp

    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.add.subcategory
      type: CUSTOM_SERVICE
      dataSource: primaryDb

      operations:
        - type: INSERT
          entity: Category