apis:
  - id: stores-get-products
    name: Get Store Product Catalogue
    version: v1
    method: GET
    path: /api/v1/stores/product
    description: Returns all products for a specific store grouped by sub-category, with real-time stock levels.
    enabled: true
    security:
      authentication:
        enabled: true
        type: JWT
        roles:
        - customer
      authorization:
        enabled: false
      rateLimit:
        enabled: true
        requestsPerMinute: 30
        requestsPerHour: 500
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters:
      - name: storeId
        type: String
        location: BODY
        required: true
        validation:
          minLength: 1
          errorMessage: Store ID is required
      - name: subCategoryId
        type: String
        location: BODY
        required: false
        validation:
          minLength: 1
          errorMessage: subCategoryId  is required
      - name: categoryId
        type: String
        location: BODY
        required: true
        validation:
          minLength: 1
          errorMessage: subCategoryId  is required
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: id
        type: Long
        description: Product identifier
      - name: history
        type: String
        description: history
      - name: data
        type: String
        description: response data
      - name: currentStatus
        type: String
        description: Current record status
        defaultValue: ACTIVE
      - name: fetchedAt
        type: LocalDateTime
        description: Data retrieval timestamp
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.stores.products
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: SELECT
        entity: Product
        mapping:
          storeId: "#{request.storeId}"
          categoryFilter: "#{request.categoryFilter}"
          available: "#{request.available}"
