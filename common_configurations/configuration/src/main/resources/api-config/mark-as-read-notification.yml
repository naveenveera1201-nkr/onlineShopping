apis:
  - id: mark-as-read-notification
    name: Register Token
    version: v1
    method: POST
    path: /api/v1/notification/markasread
    description: Register fcm token against the mobile users
    enabled: true
    security:
      authentication:
        enabled: true
        type: JWT
        roles:
        - customer
        - business
        - employee
      authorization:
        enabled: false
      rateLimit:
        enabled: true
        requestsPerMinute: 10
        requestsPerHour: 100
      encryption:
        enabled: true
        algorithm: AES256
    request:
      contentType: application/json
      parameters:
      - name: notificationId
        type: String
        location: BODY
        required: true
    response:
      successCode: 200
      contentType: application/json
      fields:
      - name: id
        type: Long
        description: Generated AuthToken ID
      - name: history
        type: String
        description: history
      - name: data
        type: String
        description: registered data
      - name: currentStatus
        type: String
        description: Record status
        defaultValue: ACTIVE
      - name: createdAt
        type: LocalDateTime
        description: Creation timestamp
      - name: createdBy
        type: String
        description: created by
    businessLogic:
      businessLogicRequired: "Y"
      processCode: nkt.notification.fcm.mark_read
      type: CUSTOM_SERVICE
      dataSource: primaryDb
      operations:
      - type: INSERT
        entity: AuthToken
        mapping:
          identifier: "#{request.identifier}"
          otp: "#{request.otp}"
          userType: "#{request.userType}"
          purpose: "#{request.purpose}"
          name: "#{request.name}"
          email: "#{request.email}"
          createdAt: "#{now()}"
          status: ACTIVE
    callbacks:
    - event: SUCCESS
      type: WEBHOOK
      url: "https://api.nammakadaitheru.in/webhooks/authtoken-event"
